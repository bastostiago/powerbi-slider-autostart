<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Power Slider Launcher</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 14px/1.45 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: #57534e; background: #f7f6f3; padding: 22px 24px; }
  img { height: 24px; display: block; margin-bottom: 16px; }
  h1 { font-size: 17px; color: #1c1917; margin: 0 0 6px; }
  p { margin: 0; }
  .row { display: flex; gap: 10px; margin-top: 20px; }
  button { flex: 1; font: inherit; font-weight: 600; border-radius: 10px; padding: 11px 14px; cursor: pointer; border: 1px solid #e8e5df; background: #fff; color: #1c1917; }
  button.primary { background: #f8b500; border-color: #f8b500; color: #1f1a14; }
  .countdown { font-size: 12px; color: #8a847c; margin-top: 12px; }
</style>
</head>
<body>
  <img src="logo.svg" alt="Power Slider" />
  <h1 data-t="updateTitle"></h1>
  <p id="text"></p>
  <div class="row">
    <button class="primary" id="yes" data-t="updateNow"></button>
    <button id="no" data-t="later"></button>
  </div>
  <p class="countdown" id="countdown"></p>
<script src="i18n.js"></script>
<script>
// The launcher closes this window after a minute without an answer and goes on presenting.
const $ = (id) => document.getElementById(id);
const answer = (update) => fetch('api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ update }) });
fetch('api/info').then((r) => r.json()).then((i) => ($('text').textContent = t('updateText', { v: i.latest, c: i.current })));
$('yes').onclick = () => { $('yes').disabled = $('no').disabled = true; answer(true); };
$('no').onclick = () => { $('yes').disabled = $('no').disabled = true; answer(false); };
let left = 60;
const tick = () => { $('countdown').textContent = t('countdown', { s: left }); if (left > 0) left -= 1; };
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
